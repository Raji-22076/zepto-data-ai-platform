<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zepto Support Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #6b21a8;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
            display: none;
        }

        .label {
            font-weight: bold;
        }

        #answer {
            margin-top: 8px;
            line-height: 1.6;
        }

        #sources {
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Zepto Support Assistant</h1>

    <textarea id="question" placeholder="Ask a question about delivery, returns, refunds, membership, tracking, cancellation, gift cards or support"></textarea>

    <button onclick="askQuestion()">Ask</button>

    <div class="result" id="result">
        <div class="label">Answer:</div>
        <div id="answer"></div>

        <br>

        <div class="label">Category:</div>
        <div id="category"></div>

        <br>

        <div class="label">Sources:</div>
        <div id="sources"></div>
    </div>
</div>

<script>
async function askQuestion() {
    const question = document.getElementById("question").value.trim();

    if (!question) {
        alert("Please enter a question.");
        return;
    }

    const result = document.getElementById("result");
    const answer = document.getElementById("answer");
    const category = document.getElementById("category");
    const sources = document.getElementById("sources");

    result.style.display = "block";
    answer.textContent = "Loading...";
    category.textContent = "";
    sources.textContent = "";

    try {
        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        answer.textContent = data.answer;
        category.textContent = data.category;
        sources.textContent = data.sources.join(", ");
    } catch (error) {
        answer.textContent = "Unable to connect to the support assistant.";
    }
}
</script>

</body>
</html>
